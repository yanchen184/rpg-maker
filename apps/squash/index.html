<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>玻璃禁區・壁球</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --cyan: #65e8ff;
        --amber: #ffc857;
        --ink: #03090d;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: radial-gradient(circle at 50% 24%, #123346 0%, #05090d 72%);
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #app { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; display: block; }
      .panel {
        position: fixed; z-index: 20; color: #effcff;
        background: linear-gradient(180deg, #07151ae8, #030a0ee8);
        border: 1px solid #6ad7f04d;
        box-shadow: 0 9px 28px #000a, inset 0 1px #dffbff17;
        backdrop-filter: blur(8px);
      }
      #score {
        top: 10px; left: 50%; transform: translateX(-50%);
        width: min(480px, 46vw); height: 62px; padding: 7px 18px;
        border-radius: 5px 5px 14px 14px; text-align: center;
        clip-path: polygon(4% 0, 96% 0, 100% 78%, 96% 100%, 4% 100%, 0 78%);
      }
      #score .score-line {
        display: grid; grid-template-columns: 1fr 42px 22px 42px 1fr;
        align-items: center; gap: 5px;
      }
      #score .name { font: 800 12px/1 system-ui; letter-spacing: 2px; }
      #left-name { color: var(--cyan); text-align: right; }
      #right-name { color: var(--amber); text-align: left; }
      #points-left, #points-right { font: 900 28px/1 system-ui; }
      #points-left { color: #d9fbff; }
      #points-right { color: #fff4ce; }
      #score .divider { color: #52717b; font-size: 15px; }
      #score .meta { color: #9bb9c0; font-size: 10px; letter-spacing: 1px; margin-top: 3px; }
      #mode-badge {
        position: fixed; z-index: 21; right: 16px; top: 13px;
        padding: 7px 11px; border: 1px solid #58e8ff8c; border-radius: 5px;
        background: #031116dc; color: var(--cyan); font: 800 10px/1 system-ui;
        letter-spacing: 1.5px; box-shadow: 0 0 18px #55dff322;
      }
      #status {
        left: 14px; bottom: 14px; width: 190px; padding: 10px 12px; border-radius: 7px;
      }
      #status .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 10px; }
      #status .row.secondary { margin-top: 8px; }
      .bar { height: 6px; background: #02080c; border: 1px solid #397383; overflow: hidden; }
      .fill { height: 100%; width: 0%; transition: width .12s linear; }
      #energy-fill { background: linear-gradient(90deg, #3edb92, #d0ff72); }
      #quality-fill { background: linear-gradient(90deg, #ff6b52, #ffd166, #7dffb2); }
      #quality-label { color: #ffd166; }
      #radar {
        left: 14px; top: 14px; width: 205px; padding: 9px 11px; border-radius: 6px;
        color: #a9c6cd; font-size: 10px; line-height: 1.45;
      }
      #radar strong { color: var(--cyan); letter-spacing: 1px; }
      #match-controls {
        right: 14px; bottom: 14px; width: 252px; padding: 10px; border-radius: 7px;
      }
      .control-row { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 7px; }
      .control-row + .control-row { margin-top: 7px; }
      .control-label { color: #8eabb2; font: 800 9px/1 system-ui; letter-spacing: .8px; }
      .button-group { display: flex; gap: 4px; }
      .control-button {
        flex: 1; min-width: 0; height: 24px; padding: 0 5px;
        border: 1px solid #41606a; border-radius: 3px;
        background: #071218; color: #b8cbd0; font: 700 9px/1 system-ui;
        cursor: pointer;
      }
      .control-button:hover { border-color: #77dff0; color: #fff; }
      .control-button.active {
        border-color: var(--cyan); color: #bff8ff; background: #0b3038;
        box-shadow: inset 0 0 10px #58e8ff18;
      }
      .control-button[data-level="hard"].active { border-color: var(--amber); color: #ffe5a3; background: #38290b; }
      #hint {
        left: 50%; bottom: 14px; transform: translateX(-50%);
        padding: 7px 12px; border-radius: 6px; font-size: 10px; white-space: nowrap;
        color: #c7e8ee;
      }
      body.watch-mode #hint { display: none; }
      body.watch-mode #touch-controls { display: none !important; }
      #flash {
        position: fixed; z-index: 40; left: 50%; top: 35%; transform: translate(-50%, -50%);
        font: 900 32px/1.15 system-ui; color: #fff; text-align: center;
        text-shadow: 0 3px 0 #052634, 0 0 24px #79e9ff; white-space: pre-line;
        pointer-events: none; opacity: 0; transition: opacity .16s;
      }
      #flash.show { opacity: 1; }
      #loading {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #153e50, #061017 66%);
        color: #c8f8ff; transition: opacity .45s;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .brand { text-align: center; }
      #loading .ball {
        width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%;
        background: #030608; border: 3px solid #56dffc; box-shadow: 0 0 28px #56dffc99;
        animation: bounce .65s ease-in-out infinite alternate;
      }
      #loading h1 { margin: 0; font: 900 30px system-ui; letter-spacing: 8px; }
      #loading p { margin: 8px 0 0; color: #72acbb; font-size: 12px; }
      @keyframes bounce { to { transform: translateY(-18px) scale(.92, 1.08); } }
      #touch-controls { display: none; }
      @media (pointer: coarse), (max-width: 820px) {
        #score { top: 5px; width: 300px; height: 52px; padding: 5px 12px; }
        #score .name { font-size: 9px; }
        #points-left, #points-right { font-size: 22px; }
        #mode-badge { top: 7px; right: 7px; }
        #status { bottom: 7px; left: 7px; width: 145px; padding: 7px; }
        #radar, #hint, #match-controls { display: none; }
        #touch-controls { display: block; position: fixed; inset: 0; z-index: 30; pointer-events: none; }
        #touch-controls button {
          pointer-events: auto; border-radius: 50%; border: 1px solid #7eeaff99;
          background: #0b2634cc; color: #e8fbff; font: 800 14px system-ui;
          width: 58px; height: 58px; -webkit-tap-highlight-color: transparent;
        }
        #touch-move { position: absolute; left: 14px; bottom: 76px; width: 174px; height: 174px; }
        #touch-move button { position: absolute; }
        #touch-move [data-key="w"] { left: 58px; top: 0; }
        #touch-move [data-key="s"] { left: 58px; bottom: 0; }
        #touch-move [data-key="a"] { left: 0; top: 58px; }
        #touch-move [data-key="d"] { right: 0; top: 58px; }
        #touch-shots { position: absolute; right: 14px; bottom: 76px; display: grid; grid-template-columns: repeat(2, 64px); gap: 8px; }
        #touch-shots button { width: 64px; height: 64px; }
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
      #rotate {
        position: fixed; inset: 0; z-index: 200; display: none; place-items: center;
        padding: 32px; background: #061017f5; color: #d9f8ff; text-align: center;
        font: 700 18px/1.6 system-ui;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="score" class="panel">
      <div class="score-line">
        <span id="left-name" class="name">YOU</span><span id="points-left">0</span>
        <span class="divider">:</span><span id="points-right">0</span><span id="right-name" class="name">RIVAL AI</span>
      </div>
      <div id="score-meta" class="meta">你發球 · 準備發球</div>
    </div>
    <div id="mode-badge">PLAYER VS AI</div>
    <div id="status" class="panel">
      <div class="row"><span>ENERGY</span><span id="energy-value">100</span></div>
      <div class="bar"><div id="energy-fill" class="fill"></div></div>
      <div class="row secondary"><span>SHOT QUALITY</span><span id="quality-label">READY</span></div>
      <div class="bar"><div id="quality-fill" class="fill"></div></div>
    </div>
    <div id="radar" class="panel">
      <strong>TACTICAL FEED</strong><br />
      <span id="rally">回合 0</span> · <span id="t-control">T 區中立</span><br />
      <span id="strategy-feed">觀察三方位置再選球</span>
    </div>
    <div id="match-controls" class="panel">
      <div class="control-row">
        <span class="control-label">MODE</span>
        <div class="button-group">
          <button id="mode-play" class="control-button active">玩家</button>
          <button id="mode-watch" class="control-button">AI 對戰</button>
        </div>
      </div>
      <div class="control-row">
        <span class="control-label">DIFFICULTY</span>
        <div class="button-group">
          <button class="control-button" data-level="easy">EASY</button>
          <button class="control-button active" data-level="normal">NORMAL</button>
          <button class="control-button" data-level="hard">HARD</button>
        </div>
      </div>
      <div class="control-row">
        <span class="control-label">BALL SPEED</span>
        <div class="button-group">
          <button class="control-button" data-speed="0.5">.5×</button>
          <button class="control-button active" data-speed="1">1×</button>
          <button class="control-button" data-speed="1.5">1.5×</button>
          <button class="control-button" data-speed="2">2×</button>
        </div>
      </div>
    </div>
    <div id="hint" class="panel">WASD 移動 · Shift 閃身 · J 平抽 · K 小球 · L 側牆 · I 後玻璃 · Space 高吊</div>
    <div id="flash"></div>
    <div id="loading"><div class="brand"><div class="ball"></div><h1>玻璃禁區</h1><p>正在喚醒球場與對手…</p></div></div>
    <div id="touch-controls">
      <div id="touch-move">
        <button data-key="w">▲</button><button data-key="a">◀</button>
        <button data-key="s">▼</button><button data-key="d">▶</button>
      </div>
      <div id="touch-shots">
        <button data-shot="drop">小球</button><button data-shot="lob">高吊</button>
        <button data-shot="boast">側牆</button><button data-shot="drive">平抽</button>
        <button data-shot="glass">後玻璃</button>
      </div>
    </div>
    <div id="rotate">請把手機轉成橫向<br />壁球館需要完整視野</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
