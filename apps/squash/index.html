<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>玻璃禁區・壁球</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --glass: #8de9ff;
        --amber: #ffc857;
        --ink: #071016;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #123346 0%, #071016 65%);
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #app { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; }
      .panel {
        position: fixed; z-index: 20; color: #effcff;
        background: linear-gradient(180deg, #07141be8, #040b10e8);
        border: 1px solid #6ad7f055; box-shadow: 0 10px 36px #0009, inset 0 1px #dffbff18;
        backdrop-filter: blur(8px);
      }
      #score {
        top: 14px; left: 50%; transform: translateX(-50%);
        min-width: 350px; padding: 9px 18px 10px; border-radius: 12px; text-align: center;
      }
      #score .title { color: #8de9ff; font-size: 11px; letter-spacing: 4px; }
      #score .points { font: 800 28px/1.15 system-ui; letter-spacing: 7px; }
      #score .meta { color: #a9c7cf; font-size: 11px; }
      #status {
        left: 14px; top: 14px; width: 210px; padding: 12px; border-radius: 12px;
      }
      #status .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 7px; font-size: 11px; }
      #status .row:last-child { margin-bottom: 0; }
      .bar { height: 8px; background: #02080c; border: 1px solid #397383; border-radius: 6px; overflow: hidden; }
      .fill { height: 100%; width: 0%; transition: width .12s linear; }
      #energy-fill { background: linear-gradient(90deg, #3edb92, #d0ff72); }
      #quality-fill { background: linear-gradient(90deg, #ff6b52, #ffd166, #7dffb2); }
      #quality-label { color: #ffd166; }
      #radar {
        right: 14px; top: 14px; width: 215px; padding: 12px; border-radius: 12px;
        color: #b9d6dd; font-size: 11px; line-height: 1.55;
      }
      #radar strong { color: #8de9ff; }
      #hint {
        left: 50%; bottom: 16px; transform: translateX(-50%);
        padding: 9px 16px; border-radius: 10px; font-size: 12px; white-space: nowrap;
        color: #d9f8ff;
      }
      #flash {
        position: fixed; z-index: 40; left: 50%; top: 36%; transform: translate(-50%, -50%);
        font: 900 38px/1.15 system-ui; color: #fff; text-align: center;
        text-shadow: 0 3px 0 #052634, 0 0 24px #79e9ff; pointer-events: none;
        opacity: 0; transition: opacity .16s;
      }
      #flash.show { opacity: 1; }
      #loading {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 42%, #153e50, #061017 66%);
        color: #c8f8ff; transition: opacity .45s;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .brand { text-align: center; }
      #loading .ball {
        width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%;
        background: #030608; border: 3px solid #56dffc; box-shadow: 0 0 28px #56dffc99;
        animation: bounce .65s ease-in-out infinite alternate;
      }
      #loading h1 { margin: 0; font: 900 30px system-ui; letter-spacing: 8px; }
      #loading p { margin: 8px 0 0; color: #72acbb; font-size: 12px; }
      @keyframes bounce { to { transform: translateY(-18px) scale(.92, 1.08); } }
      #touch-controls { display: none; }
      @media (pointer: coarse), (max-width: 820px) {
        #score { top: 6px; min-width: 260px; padding: 6px 10px; }
        #score .points { font-size: 21px; }
        #status { top: auto; bottom: 8px; left: 8px; width: 160px; padding: 8px; }
        #radar { display: none; }
        #hint { display: none; }
        #touch-controls { display: block; position: fixed; inset: 0; z-index: 30; pointer-events: none; }
        #touch-controls button {
          pointer-events: auto; border-radius: 50%; border: 1px solid #7eeaff99;
          background: #0b2634cc; color: #e8fbff; font: 800 14px system-ui;
          width: 58px; height: 58px; -webkit-tap-highlight-color: transparent;
        }
        #touch-move { position: absolute; left: 14px; bottom: 76px; width: 174px; height: 174px; }
        #touch-move button { position: absolute; }
        #touch-move [data-key="w"] { left: 58px; top: 0; }
        #touch-move [data-key="s"] { left: 58px; bottom: 0; }
        #touch-move [data-key="a"] { left: 0; top: 58px; }
        #touch-move [data-key="d"] { right: 0; top: 58px; }
        #touch-shots {
          position: absolute; right: 14px; bottom: 76px; display: grid;
          grid-template-columns: repeat(2, 64px); gap: 8px;
        }
        #touch-shots button { width: 64px; height: 64px; }
        #touch-shots [data-shot="drive"] { background: #176d77dd; }
        #touch-shots [data-shot="drop"] { background: #5b4b8add; }
        #touch-shots [data-shot="boast"] { background: #9b5428dd; }
        #touch-shots [data-shot="lob"] { background: #2b6e45dd; }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: grid; }
      }
      #rotate {
        position: fixed; inset: 0; z-index: 200; display: none; place-items: center;
        padding: 32px; background: #061017f5; color: #d9f8ff; text-align: center;
        font: 700 18px/1.6 system-ui;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="score" class="panel">
      <div class="title">GLASS COURT · POINT-A-RALLY 11</div>
      <div id="points" class="points">0 : 0</div>
      <div id="score-meta" class="meta">你發球 · 搶下 T 區</div>
    </div>
    <div id="status" class="panel">
      <div class="row"><span>氣力</span><span id="energy-value">100</span></div>
      <div class="bar"><div id="energy-fill" class="fill"></div></div>
      <div class="row" style="margin-top:9px"><span>擊球品質</span><span id="quality-label">READY</span></div>
      <div class="bar"><div id="quality-fill" class="fill"></div></div>
    </div>
    <div id="radar" class="panel">
      <strong>戰術雷達</strong><br />
      <span id="rally">回合 0</span> · <span id="t-control">T 區中立</span><br />
      前牆 → 最多一次落地 → 回擊<br />
      J 平抽　K 小球　L 側牆　Space 高吊
    </div>
    <div id="hint" class="panel">WASD 移動 · Shift 閃身 · 方向鍵改變前牆落點</div>
    <div id="flash"></div>
    <div id="loading"><div class="brand"><div class="ball"></div><h1>玻璃禁區</h1><p>正在喚醒球場與對手…</p></div></div>
    <div id="touch-controls">
      <div id="touch-move">
        <button data-key="w">▲</button><button data-key="a">◀</button>
        <button data-key="s">▼</button><button data-key="d">▶</button>
      </div>
      <div id="touch-shots">
        <button data-shot="drop">小球</button><button data-shot="lob">高吊</button>
        <button data-shot="boast">側牆</button><button data-shot="drive">平抽</button>
      </div>
    </div>
    <div id="rotate">請把手機轉成橫向<br />壁球館需要完整視野</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
