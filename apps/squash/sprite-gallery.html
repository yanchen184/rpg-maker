<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>玻璃禁區・動作驗收室</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, "PingFang TC", sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; color: #eafcff;
        background: radial-gradient(circle at 50% 0%, #16465a, #061016 60%);
      }
      header { max-width: 1100px; margin: 0 auto; padding: 34px 24px 18px; }
      h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 3px; }
      p { margin: 0; color: #9bc4ce; line-height: 1.65; }
      #status { margin-top: 12px; color: #7dffb2; font: 12px ui-monospace, monospace; }
      #controls { display: flex; gap: 8px; margin-top: 14px; }
      #controls button {
        border: 1px solid #70ddf877; border-radius: 8px; padding: 7px 12px;
        background: #0c2631; color: #dffaff; cursor: pointer;
      }
      #grid {
        max-width: 1100px; margin: 0 auto; padding: 18px 24px 40px;
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px;
      }
      .character-heading {
        grid-column: 1 / -1; margin: 18px 0 0; padding-bottom: 9px;
        border-bottom: 1px solid currentColor; font-size: 18px; letter-spacing: 2px;
      }
      .card {
        overflow: hidden; border: 1px solid #70ddf855; border-radius: 16px;
        background: linear-gradient(155deg, #102c38, #071219);
        box-shadow: 0 18px 44px #0007;
      }
      .stage {
        position: relative; display: grid; place-items: center; min-height: 320px;
        background:
          linear-gradient(90deg, transparent 49.6%, #ffc85744 50%, transparent 50.4%),
          linear-gradient(180deg, #173b49 0 54%, #d8cba4 54% 100%);
      }
      .stage::after {
        content: ""; position: absolute; left: 0; right: 0; top: 54%;
        height: 5px; background: #b53a38;
      }
      canvas { position: relative; z-index: 1; image-rendering: pixelated; }
      .copy { padding: 15px 17px 18px; }
      .title { font-weight: 800; letter-spacing: 1px; }
      .detail { margin-top: 5px; color: #8fb7c0; font-size: 12px; line-height: 1.55; }
      @media (max-width: 820px) { #grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>壁球角色動作驗收室</h1>
      <p>逐幀檢查後視角面牆方向、人物視線、重心、拍面和擊球接觸點。所有情緒都由臉部與身體演出，不使用頭頂表情符號。</p>
      <div id="status">正在載入 216 幀雙角色旗艦素材…</div>
      <div id="controls">
        <button id="pause" type="button">暫停</button>
        <button id="prev" type="button">上一幀</button>
        <button id="next" type="button">下一幀</button>
      </div>
    </header>
    <main id="grid"></main>
    <script type="module" src="/src/sprite-gallery.ts"></script>
  </body>
</html>
